name: Atualizar notícias
on:
  schedule:
    - cron: "0 9,12,15,18,21 * * 1-5"   # UTC, dias úteis
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_news.py
        env:
          GNEWS_KEY: ${{ secrets.GNEWS_KEY }}
      - name: Commit
        run: |
          git config user.name "news-bot"; git config user.email "bot@users.noreply.github.com"
          git add news.json; git diff --cached --quiet || (git commit -m "news: atualização" && git push)
